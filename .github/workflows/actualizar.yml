name: Actualizar HiddenKernel Repository

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "actualizador.py"
      - "actualizador_pkg.py"
      - "payloads/fpkg-tests/**"
      - ".github/workflows/actualizar.yml"

  schedule:
    - cron: "17 */3 * * *"

concurrency:
  group: hiddenkernel-store-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Actualizar catalogos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m py_compile actualizador.py actualizador_pkg.py
          python actualizador.py
          python actualizador_pkg.py

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios."
            exit 0
          fi

          git commit -m "Actualizar HiddenKernel: catalogo, FPKG y workflow"

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD^)" ]; then
            echo "main cambió durante la ejecución; reintentando sobre el último main..."
            git rebase origin/main
          fi

          git push origin HEAD:main
