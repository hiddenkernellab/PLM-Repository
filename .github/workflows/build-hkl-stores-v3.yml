      - name: Build PS5 SDK and HTTPS toolchain
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/itsPLK/ps5-payload-manager.git /tmp/pldmgr
          docker build --tag hkl-ps5-payload-sdk -f /tmp/pldmgr/Dockerfile.sdk /tmp/pldmgr
      - name: Cross-compile native PS5 ELF
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/src" -w /src hkl-ps5-payload-sdk bash -euxo pipefail -c '
            git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git /tmp/hkl-zlib
            test "$(git -C /tmp/hkl-zlib rev-parse HEAD)" = "51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf"
            mkdir -p four-stores/third_party/zlib
            cp /tmp/hkl-zlib/*.[ch] four-stores/third_party/zlib/
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq file binutils
            make -C four-stores clean all
            test -s four-stores/HiddenKernel-4Stores.elf
            file four-stores/HiddenKernel-4Stores.elf
            readelf -h four-stores/HiddenKernel-4Stores.elf
          '
      - name: Publish the installable ELF
        uses: actions/upload-artifact@v4
        with:
          name: HiddenKernel-4Stores-ELF
          path: four-stores/HiddenKernel-4Stores.elf
          if-no-files-found: error
          retention-days: 30
