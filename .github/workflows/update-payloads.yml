#!/usr/bin/env python3

import hashlib
import json
import os
import re
import sys

from datetime import datetime
from pathlib import Path
from urllib.request import Request, urlopen
from urllib.error import HTTPError, URLError


ROOT = Path(__file__).resolve().parent
SOURCES_FILE = ROOT / "sources.json"
OUTPUT_FILE = ROOT / "payloads.json"

TOKEN = os.environ.get("GITHUB_TOKEN", "").strip()
UA = "HiddenKernel-PLM-Repository/1.0"


CHANNEL_ORDER = {
    "stable": 0,
    "beta": 1,
    "alpha": 2,
}

CATEGORY_ORDER = {
    "SYSTEM": 0,
    "HEN": 1,
    "GAMES": 2,
    "TOOLS": 3,
    "STORES": 4,
    "EXPERIMENTAL": 5,
}


ALPHA_RE = re.compile(
    r"(?i)(alpha|experimental|nightly|canary|(?:^|[\s._-])dev(?:$|[\s._0-9-]))"
)

BETA_RE = re.compile(
    r"(?i)(beta|release[\s._-]*candidate|\brc[\s._-]*\d*|preview)"
)


def api_json(url):
    headers = {
        "Accept": "application/vnd.github+json",
        "User-Agent": UA,
        "X-GitHub-Api-Version": "2022-11-28",
    }

    if TOKEN:
        headers["Authorization"] = f"Bearer {TOKEN}"

    request = Request(
        url,
        headers=headers,
    )

    with urlopen(
        request,
        timeout=30,
    ) as response:
        return json.load(response)


def channel_of(release):
    text = (
        f'{release.get("tag_name", "")} '
        f'{release.get("name", "")}'
    )

    if ALPHA_RE.search(text):
        return "alpha"

    if BETA_RE.search(text):
        return "beta"

    if release.get(
        "prerelease",
        False,
    ):
        return "beta"

    return "stable"


def release_time(release):
    value = (
        release.get("published_at")
        or release.get("created_at")
        or ""
    )

    try:
        return datetime.fromisoformat(
            value.replace(
                "Z",
                "+00:00",
            )
        ).timestamp()

    except ValueError:
        return 0


def find_asset(
    release,
    pattern,
):
    regex = re.compile(pattern)

    matches = [
        asset
        for asset in release.get(
            "assets",
            [],
        )
        if regex.search(
            asset.get(
                "name",
                "",
            )
        )
    ]

    if not matches:
        return None

    matches.sort(
        key=lambda asset: (
            0
            if asset.get(
                "name",
                "",
            ).lower().endswith(".elf")
            else 1,
            len(
                asset.get(
                    "name",
                    "",
                )
            ),
            asset.get(
                "name",
                "",
            ).lower(),
        )
    )

    return matches[0]


def sha256_url(url):
    digest = hashlib.sha256()

    request = Request(
        url,
        headers={
            "User-Agent": UA
        },
    )

    with urlopen(
        request,
        timeout=180,
    ) as response:

        while True:
            chunk = response.read(
                1024 * 1024
            )

            if not chunk:
                break

            digest.update(chunk)

    return digest.hexdigest()


def display_name(
    base_name,
    channel,
):
    if channel == "stable":
        return base_name

    if channel == "beta":
        return (
            f"{base_name} (Beta)"
        )

    return (
        f"{base_name} "
        f"(Alpha - INESTABLE)"
    )


def description(
    source,
    channel,
):
    prefixes = {
        "stable": (
            "RECOMENDADA · "
            "Versión estable."
        ),
        "beta": (
            "BETA · "
            "Versión de pruebas."
        ),
        "alpha": (
            "INESTABLE · "
            "Versión alpha/experimental."
        ),
    }

    base = source.get(
        "description",
        "",
    )

    return (
        f'{prefixes[channel]} '
        f'{base}'
    ).strip()


def load_previous():
    try:
        data = json.loads(
            OUTPUT_FILE.read_text(
                encoding="utf-8"
            )
        )

        return {
            item["name"]: item
            for item in data.get(
                "payloads",
                [],
            )
            if isinstance(
                item,
                dict,
            )
            and item.get("name")
        }

    except Exception:
        return {}


def build_source(
    source,
    previous,
):
    url = (
        "https://api.github.com/"
        f'repos/{source["repo"]}/'
        "releases?per_page=100"
    )

    releases = [
        release
        for release in api_json(url)
        if not release.get(
            "draft",
            False,
        )
    ]

    releases.sort(
        key=release_time,
        reverse=True,
    )

    result = []

    channels = source.get(
        "channels",
        [
            "stable",
            "beta",
            "alpha",
        ],
    )

    for channel in channels:
        selected = None

        for release in releases:

            if (
                channel_of(release)
                != channel
            ):
                continue

            asset = find_asset(
                release,
                source[
                    "asset_regex"
                ],
            )

            if asset:
                selected = (
                    release,
                    asset,
                )
                break

        if not selected:
            continue

        release, asset = selected

        name = display_name(
            source["name"],
            channel,
        )

        try:
            direct_url = asset[
                "browser_download_url"
            ]

            result.append({
                "name": name,
                "filename": asset["name"],
                "url": direct_url,
                "description": description(
                    source,
                    channel,
                ),
                "version": (
                    release.get("tag_name")
                    or release.get("name")
                    or "unknown"
                ),
                "category": source[
                    "category"
                ],
                "checksum": sha256_url(
                    direct_url
                ),
                "_channel": channel,
            })

        except Exception as error:

            if name in previous:
                old = dict(
                    previous[name]
                )

                old[
                    "_channel"
                ] = channel

                result.append(old)

                print(
                    f"AVISO: conservo "
                    f"{name}: {error}",
                    file=sys.stderr,
                )

    return result


def main():
    config = json.loads(
        SOURCES_FILE.read_text(
            encoding="utf-8"
        )
    )

    previous = load_previous()

    generated = []

    for source_index, source in enumerate(
        config["payloads"]
    ):

        try:
            items = build_source(
                source,
                previous,
            )

        except (
            HTTPError,
            URLError,
            TimeoutError,
            OSError,
            ValueError,
        ) as error:

            print(
                f'ERROR '
                f'{source["name"]}: '
                f'{error}',
                file=sys.stderr,
            )

            items = []

        if not items:

            for channel in source.get(
                "channels",
                [
                    "stable",
                    "beta",
                    "alpha",
                ],
            ):

                name = display_name(
                    source["name"],
                    channel,
                )

                if name in previous:

                    old = dict(
                        previous[name]
                    )

                    old[
                        "_channel"
                    ] = channel

                    items.append(old)

        for item in items:

            item[
                "_source_order"
            ] = source_index

            generated.append(item)


    generated.sort(
        key=lambda item: (
            CATEGORY_ORDER.get(
                item.get(
                    "category",
                    "",
                ),
                99,
            ),
            item.get(
                "_source_order",
                999,
            ),
            CHANNEL_ORDER.get(
                item.get(
                    "_channel",
                    "stable",
                ),
                99,
            ),
        )
    )


    for item in generated:

        item.pop(
            "_source_order",
            None,
        )

        item.pop(
            "_channel",
            None,
        )


    output = {
        "name": config.get(
            "name",
            "HiddenKernel Repository",
        ),
        "payloads": generated,
    }


    temp = OUTPUT_FILE.with_suffix(
        ".json.tmp"
    )

    temp.write_text(
        json.dumps(
            output,
            ensure_ascii=False,
            indent=2,
        )
        + "\n",
        encoding="utf-8",
    )

    temp.replace(
        OUTPUT_FILE
    )

    print(
        f"OK: {len(generated)} "
        f"entradas escritas en "
        f"{OUTPUT_FILE.name}"
    )


if __name__ == "__main__":
    main()
