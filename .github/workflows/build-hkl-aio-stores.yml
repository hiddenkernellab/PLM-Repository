      - name: Confirm dual install-location support
        run: |
          grep -F '/data/homebrew' four-stores/src/main.c
          grep -F '/data/etaHEN/games' four-stores/src/main.c
          grep -F 'DUPLICATE/AMBIGUOUS' four-stores/src/main.c
      - name: Check AIO implementation and payload limitations
        shell: bash
        run: |
          set -euo pipefail
          for component in 'Orbit Store' 'Overdrive' 'BlackBox' 'Prospero Store' 'RecompStore' 'Spectrum Library' 'Pegasus DL'; do
            grep -Fq "$component" four-stores/src/main.c
          done
          grep -Fq 'DOWNLOADED (not installed)' four-stores/src/main.c
      - name: Build PS5 SDK with HTTPS support
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/itsPLK/ps5-payload-manager.git /tmp/pldmgr
          docker build --tag hkl-ps5-sdk -f /tmp/pldmgr/Dockerfile.sdk /tmp/pldmgr
      - name: Compile native PS5 ELF
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "${{ github.workspace }}:/src" -w /src hkl-ps5-sdk bash -euxo pipefail -c '
            git clone --depth 1 --branch v1.3.1 https://github.com/madler/zlib.git /tmp/hkl-zlib
            test "$(git -C /tmp/hkl-zlib rev-parse HEAD)" = "51b7f2abdade71cd9bb0e7a373ef2610ec6f9daf"
            mkdir -p four-stores/third_party/zlib
            cp /tmp/hkl-zlib/*.[ch] four-stores/third_party/zlib/
            make -C four-stores clean all
            test -s four-stores/HiddenKernel-AIO-Stores.elf
          '
      - name: Verify PS5 ELF and checksum
        shell: bash
        run: |
          set -euo pipefail
          test -s four-stores/HiddenKernel-AIO-Stores.elf
          file four-stores/HiddenKernel-AIO-Stores.elf
          readelf -h four-stores/HiddenKernel-AIO-Stores.elf
          file four-stores/HiddenKernel-AIO-Stores.elf | grep -q "ELF 64-bit.*x86-64"
          sha256sum four-stores/HiddenKernel-AIO-Stores.elf > four-stores/HiddenKernel-AIO-Stores.elf.sha256
      - name: Publish ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: HiddenKernel-AIO-Stores-ELF
          path: |
            four-stores/HiddenKernel-AIO-Stores.elf
            four-stores/HiddenKernel-AIO-Stores.elf.sha256
          if-no-files-found: error
          retention-days: 30

